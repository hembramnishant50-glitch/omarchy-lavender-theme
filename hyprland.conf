# ────────────────────────────────────────────────────────────
# Omarchy Catppuccin Mocha Theme (matched to Waybar)
# ────────────────────────────────────────────────────────────

general {
    border_size = 2 
    col.active_border = rgba(cba6f7ff) 
    col.inactive_border = rgba(313244ff) 

    gaps_in = 3
    gaps_out = 6
}

animations {
    enabled = yes
    
    # A fluid curve with a slight bounce (overshoot) at the end
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    # A smooth, fast curve for fading and simple transitions
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = wind, 0.2, 0.8, 0.2, 1

    animation = windows,     1, 5, overshot, popin 15%
    animation = windowsIn,   1, 5, overshot, popin 15%
    animation = windowsOut,  1, 4, smoothOut, slide
    animation = windowsMove, 1, 5, overshot
    animation = fade,        1, 4, default
    animation = fadeIn,      1, 4, default
    animation = fadeOut,     1, 4, default
    animation = layers,      1, 4, overshot, popin 10%
    animation = layersIn,    1, 4, overshot, popin 10%
    animation = layersOut,   1, 3, smoothOut, slide
    animation = workspaces,  1, 6, wind, slide
}

decoration {
    rounding = 14
    
    # Slight transparency on inactive windows to let the blur show through
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0 

    shadow {
        enabled = true
        range = 25
        render_power = 3
        color = rgba(00000077) 
        offset = 0 4
    } 
    
    blur {
        enabled = true
        size = 6
        passes = 3
        contrast = 1.4
        brightness = 1.2
        vibrancy = 0.4
        vibrancy_darkness = 0.0
        noise = 0.02          # Reduced noise for a cleaner, modern look
        ignore_opacity = true
        new_optimizations = on
    }
}
# ────────────────────────────────────────────────────────────
# Ghostty Size & Position Fix
# ────────────────────────────────────────────────────────────
windowrule = match:class com.mitchellh.ghostty, size 960 640
windowrule = match:class com.mitchellh.ghostty, center on

# ────────────────────────────────────────────────────────────
# Game Opacity - Full opacity for video games
# ────────────────────────────────────────────────────────────
windowrule = opacity 1.0 override, match:content game


# ────────────────────────────────────────────────────────────
# Game Opacity - Full opacity for video games & launchers
# ────────────────────────────────────────────────────────────
windowrule = match:class (?i)(steam|steam_app_.*|retroarch|minecraft.*|.*geforcenow.*|.*xbox.*|moonlight|lutris|heroic), opacity 1.0 override 1.0 override


# ────────────────────────────────────────────────────────────
# Layer Rules (UI Elements)
# ────────────────────────────────────────────────────────────
# Walker
layerrule = match:namespace walker, blur on
layerrule = match:namespace walker, ignore_alpha 0

# Waybar
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.1

# Notifications
layerrule = match:namespace notifications, blur on
layerrule = match:namespace notifications, ignore_alpha 0

# Vicinae
layerrule = match:namespace vicinae, blur on
layerrule = match:namespace vicinae, ignore_alpha 0.1

# SwayOSD
layerrule = match:namespace swayosd, blur on


windowrule {
    name = omarchy-wg-manager
    match:class = OmarchyFloatingTerm
    float = on
    size = 800 450
    # Center horizontally using math, drop 50px from top to avoid Waybar
    move = ((monitor_w*0.5)-(800*0.5)) 50 
    rounding = 14

    # The "override" keyword forces the exact opacity instead of multiplying
    opacity = 1.0 override
}













