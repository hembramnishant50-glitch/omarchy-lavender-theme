$activeBorderColor = rgb(cba6f7)
$inactiveBorderColor = rgb(313244)
$groupBorderColor = rgb(cba6f7)
$backgroundColor = rgb(11111b)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000066)
        offset = 0 4
    }

    blur {
        enabled = true
        size = 6              # Increased size for a wider, softer blur spread
        passes = 3            # 3 passes is the sweet spot for a smooth frosted glass look
        contrast = 1.0
        brightness = 1.1
        vibrancy = 0.16       # Brings out underlying wallpaper colors slightly
        vibrancy_darkness = 0.0
        noise = 0.02          # Reduced noise for a cleaner, modern look
        ignore_opacity = true
        new_optimizations = on
    }
}

group {
    col.border_active = $groupBorderColor
    col.border_inactive = $inactiveBorderColor
    groupbar {
        text_color = rgb(cdd6f4)
        gradients = false
        height = 20
    }
}

animations {
    enabled = true

    # Custom bezier curves for smooth, natural movement
    bezier = fluent_decel, 0, 0.2, 0.4, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutCubic, 0.215, 0.61, 0.355, 1
    bezier = easeInOutSine, 0.37, 0, 0.63, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    # Window opening/closing and switching
    animation = windows, 1, 4, overshot, popin 60%
    animation = windowsIn, 1, 4, overshot, popin 60%
    animation = windowsOut, 1, 3, fluent_decel, popin 80%
    animation = windowsMove, 1, 4, easeOutCubic, slide

    # Fading effects
    animation = fade, 1, 3, fluent_decel

    # Workspace switching animations
    animation = workspaces, 1, 5, easeOutCubic, slidefade 15%
    animation = specialWorkspace, 1, 5, easeOutCubic, slidefadevert 15%
}

# ────────────────────────────────────────────────────────────
# Ghostty Size & Position Fix
# ────────────────────────────────────────────────────────────
#windowrule = match:class com.mitchellh.ghostty, size 960x640
windowrule = match:class com.mitchellh.ghostty, center on

# ────────────────────────────────────────────────────────────
# Game Opacity - Full opacity for video games
# ────────────────────────────────────────────────────────────
windowrule = opacity 1.0 override, match:content game


# ────────────────────────────────────────────────────────────
# Layer Rules
# ────────────────────────────────────────────────────────────


layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0, match:namespace walker
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications
layerrule = blur on, match:namespace vicinae
layerrule = blur on, match:namespace swayosd
layerrule = ignore_alpha 0.1, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace vicinae
