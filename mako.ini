# =============================================================================
# MAKO CONFIGURATION (Omarchy / Walker Theme)
# =============================================================================

# Colors (Catppuccin Mocha)
text-color=#cdd6f4
# Matches Waybar mauve accent (#cba6f7)
border-color=#cba6f7
background-color=#11111bee
progress-color=#cba6f7

# Layout
width=350
height=110
padding=15
margin=15
# Match Waybar 1.5px border look
border-size=2
# Rounded "Pill" look
border-radius=15
outer-margin=10
anchor=top-right
layer=overlay

# Typography
font=JetBrainsMono Nerd Font Bold 10
default-timeout=5000

# =============================================================================
# SPECIFIC APP RULES
# =============================================================================

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

[urgency=high]
border-color=#cba6f7
default-timeout=0